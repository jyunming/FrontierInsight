[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-insight"
version = "0.1.0"
description = "Autonomous research assistant: give it a topic, get back a paper, the experiment code, and figures. Integrates with VSCode Copilot Chat."
# Explicit content-type so PyPI renders the long_description as
# CommonMark/GFM (setuptools infers this from the .md suffix today,
# but the dict form removes any doubt for older builders and makes
# the contract obvious to readers).
#
# Tag-drift note: links inside README.md target `blob/main` and
# `tree/main`, which means an old PyPI release page (e.g. v0.1.0 a
# year from now) will surface CURRENT docs rather than docs frozen
# to that release. We accept this for the alpha/early-stage phase:
# the docs improve over time, and pinning to release tags
# (`blob/v0.1.0`, `blob/v0.2.0`, …) requires release tooling that
# rewrites the README before each `twine upload` — not worth the
# complexity until the project is past 1.0 and old releases get
# meaningfully different docs. When that happens, add a pre-publish
# step under `scripts/` that sed-replaces `blob/main` and
# `tree/main` with the current release tag.
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jyunming" }]
keywords = [
  "research",
  "agent",
  "langgraph",
  "vscode",
  "copilot",
  "llm",
  "automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

# Core runtime dependencies. Optional features that require heavy or
# environment-specific deps (PDF, Docker, knowledge layer) are in
# `[project.optional-dependencies]` below so a `pip install
# frontier-insight` doesn't pull GBs of unrelated wheels.
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "requests>=2.31",
  "httpx>=0.27",
  "tenacity>=8.2",
  "openai>=1.40",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",  # GUI paper-upload endpoint (multipart forms)
  "psutil>=5.9",
  # Cross-process lock around a skill's provenance.json, so two quests
  # recording a use of the same skill can't lose each other's record.
  "filelock>=3.13",
  # Document rendering. Core rather than an extra: these produce the
  # artifacts users actually come for (slides.pptx, paper.pdf), and on a
  # locked-down host an OS-level pandoc/marp install is often impossible,
  # which is the whole reason they ship as wheels. An extra would mean the
  # default install still silently skips the outputs.
  #   python-pptx  -> generation/_pptx_slides.py renders slides.pptx with no
  #                   external binary at all.
  #   pypandoc_binary -> bundles a real pandoc; generation/_pandoc.py prefers
  #                   a system install and falls back to this one.
  #   pillow       -> imported directly by _pptx_slides.py (image sizing),
  #                   scripts/render_icon.py, and the icon regression tests.
  #                   python-pptx pulls it transitively, but a direct import
  #                   riding a transitive dep is one resolver change from
  #                   breaking.
  "python-pptx>=0.6.23",
  "pypandoc_binary>=1.13",
  "pillow>=10.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docker = ["docker>=7.1"]
knowledge = ["axon-rag>=0.4.2", "tqdb>=0.8.4"]
# Web-research full-text extraction (main-content / boilerplate removal).
# Optional: the knowledge layer falls back to a built-in extractor when
# absent, but trafilatura gives markedly cleaner article bodies.
web = ["trafilatura>=1.8"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "pytest-cov>=6.0",
  "pytest-testmon>=2.2",
]
# Expanded to the concrete deps rather than a self-reference
# (`frontier-insight[pdf,docker,knowledge]`) — some pip resolver
# versions choke on the self-referential form during sdist builds
# where the package metadata isn't fully resolved yet.
all = [
  "pypdf>=4.0",
  "docker>=7.1",
  "axon-rag>=0.4.2",
  "tqdb>=0.8.4",
  "trafilatura>=1.8",
]

[project.urls]
Homepage = "https://github.com/jyunming/FrontierInsight"
Documentation = "https://github.com/jyunming/FrontierInsight/tree/main/docs"
Repository = "https://github.com/jyunming/FrontierInsight"
Issues = "https://github.com/jyunming/FrontierInsight/issues"

# The `fi` console script: `pip install frontier-insight` exposes
# `fi --config my.yaml` as a globally-callable command. Points at
# `launch:main` which is the existing top-level entry function.
[project.scripts]
fi = "launch:main"
frontier-insight = "launch:main"

# Setuptools package discovery. The runtime code lives in top-level
# packages (`core`, `generation`, `web`). The `agents/` and
# `templates/` directories are ALSO declared as packages (each has an
# `__init__.py`) because the engine resolves prompts via
# `Path(__file__).parent.parent / "agents"` and the paper generator
# resolves LaTeX templates via `.../templates/paper/<venue>/`. For
# those relative-path lookups to work in a wheel install, the
# directories must end up alongside `core/` in `<site-packages>/`,
# which only happens when setuptools treats them as packages.
[tool.setuptools]
py-modules = ["launch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "generation*", "web*", "agents*", "templates*"]
exclude = [
  "tests*",
  "dev*",
  "docs*",
  "examples*",
  "outputs*",
  "tools*",
  "vscode-frontier-insight*",
  "scripts*",
  ".pytest_tmp*",
]

# Non-Python assets that ship inside the wheel. The `*` key applies
# the glob to every discovered package, so `agents/*.md` (prompt
# templates loaded by core/engine.py) and `templates/paper/<venue>/
# *.tex` (LaTeX templates used by generation/paper.py) land in the
# wheel and are reachable via the same relative paths the runtime
# uses in the source tree.
[tool.setuptools.package-data]
"*" = ["*.md", "*.tex", "*.css", "*.html", "*.js", "*.otf"]
