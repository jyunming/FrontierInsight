name: CI

# Runs on every PR only; a push to main is not tested again, because the PR already ran the same code. The fast
# pytest tier is on both OSes. The slow tier (e2e tests that build a real venv per tmp_path, knowledge-
# writeback flow, real `tenacity` waits, plus anything tagged `@pytest.mark.slow`) runs on ubuntu.
#
# Extension-only PRs (touching just `vscode-frontier-insight/**`) get
# their own TypeScript-compile job so they aren't merged blind — the
# `vsix-rebuild.yml` workflow only runs post-merge.

on:
  pull_request:
    # Deliberately NOT filtered to `branches: [main]`. A stacked PR (one
    # whose base is another feature branch) would otherwise run no checks
    # at all and merge unverified, which is the opposite of what the
    # header comment above promises. Every PR gets the fast tier.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "outputs/**"

# Cancel a PR's in-flight CI when a new commit is pushed to the same PR — no
# point spending minutes on a superseded diff.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- Python pytest (fast tier) -----------------------------------
  # Split into shards that run side by side: tests/conftest.py keeps, for FI_TEST_SHARD=k/n, only the test files
  # whose path hashes to shard k, so the n shards of one OS together run every fast-tier test exactly once. Windows
  # is the slower runner, so it gets more shards.
  fast:
    name: pytest (fast tier, ${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    # Skip when the change is extension-only — the `extension` job
    # below handles TS PRs on its own.
    if: |
      !contains(github.event.pull_request.title, '[ext-only]') &&
      !startsWith(github.event.head_commit.message, 'chore(vsix):')
    strategy:
      # Don't kill the whole matrix when one OS fails — Windows has
      # specific quirks (file locks) we want to see independently.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 0, shards: 2 }
          - { os: ubuntu-latest, shard: 1, shards: 2 }
          - { os: windows-latest, shard: 0, shards: 3 }
          - { os: windows-latest, shard: 1, shards: 3 }
          - { os: windows-latest, shard: 2, shards: 3 }
    runs-on: ${{ matrix.os }}
    env:
      FI_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ``[docker]`` extra is needed because ``tests/test_docker_executor.py``
      # uses ``patch("docker.from_env", ...)`` which resolves the
      # attribute at patch-enter time and requires the ``docker``
      # package to be importable even when the test doesn't actually
      # spawn a daemon.
      - name: Install package + dev + docker extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docker]

      # The fast tier excludes:
      #   - tests/test_engine_smoke.py    (real venv builds, 50-63s each)
      #   - tests/test_self_correction_e2e.py
      #   - tests/test_web_e2e.py
      #   - any test tagged @pytest.mark.slow
      # Each shard records coverage; the `coverage` job below joins one OS's shards and applies the floor.
      # pytest.ini gives every test a time limit. On Windows a test past it ends its worker; --max-worker-restart=0
      # then stops the shard with that test named in the summary (a replacement worker re-ran the hung test, and
      # under --dist loadfile could end the run in an xdist INTERNALERROR that printed no name).
      - name: Run pytest (fast tier)
        run: >-
          pytest -q -m "not slow" -n auto --dist loadfile --max-worker-restart=0 --durations=25
          --ignore=tests/test_engine_smoke.py
          --ignore=tests/test_self_correction_e2e.py
          --ignore=tests/test_web_e2e.py
          --cov=core --cov=generation --cov=launch
          --cov-report=

      # A name without the leading dot: upload-artifact leaves hidden files out.
      - name: Keep this shard's coverage data
        shell: bash
        run: mv .coverage "coverage-data-${{ matrix.os }}-${{ matrix.shard }}"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.shard }}
          path: coverage-data-${{ matrix.os }}-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
          # A re-run (e.g. "Re-run all jobs") uploads the same name again.
          overwrite: true

  # ---- Fast-tier coverage floor, per OS ------------------------------
  # Coverage floor guards against a change that silently deletes tested
  # behaviour. Fast-tier line coverage of core+generation+launch measured
  # at 74%; the gate is set to 65% — comfortably below, so normal OS /
  # skipif variance doesn't flake CI, while a real coverage collapse
  # (a whole module going untested) still fails the build. Ratchet up as
  # coverage improves. It is applied to the joined data of all of one OS's
  # shards (the same number a single unsplit run gives), on that OS so the
  # recorded file paths match the checkout.
  coverage:
    name: coverage floor (fast tier, ${{ matrix.os }})
    needs: [fast]
    strategy:
      fail-fast: false
      matrix:
        # `shards` must match the fast job's matrix for that OS; the join below refuses a different count.
        include:
          - { os: ubuntu-latest, shards: 2 }
          - { os: windows-latest, shards: 3 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage
        run: python -m pip install coverage

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-${{ matrix.os }}-*
          path: covdata
          merge-multiple: true

      - name: Join the shards and apply the coverage floor
        shell: bash
        run: |
          found=$(ls covdata | wc -l)
          if [ "$found" -ne "${{ matrix.shards }}" ]; then
            echo "::error::expected ${{ matrix.shards }} shards' coverage data, found $found"; ls covdata; exit 1
          fi
          python -m coverage combine covdata/*
          python -m coverage report --show-missing --skip-covered --fail-under=65

  # ---- Python pytest (slow tier) -----------------------------------
  slow:
    # Runs on every PR so the slow tier gates the merge. A post-merge-only gate misses regressions that only fail
    # in the slow tier (e.g. mode-reducer mismatches, or the rc=5
    # "no slow-tagged tests" exit). It runs alongside the fast tier rather than after it: the PR's checks gate the
    # merge whatever order the jobs run in, and waiting for the fast tier only added its time to every PR's.
    name: pytest (slow tier, ubuntu only)
    # The same skip rule as the fast tier (it used to follow from `needs: [fast]`).
    if: |
      !contains(github.event.pull_request.title, '[ext-only]') &&
      !startsWith(github.event.head_commit.message, 'chore(vsix):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev + docker extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docker]

      # Slow tier covers BOTH (a) the three e2e files the fast tier
      # skips by path AND (b) every test tagged @pytest.mark.slow
      # outside those files. Without the second pytest invocation, a
      # `slow`-tagged provider-retry / knowledge-writeback test would
      # be excluded by the fast tier's `-m "not slow"` filter AND
      # missed by the slow tier's file allowlist — never running
      # anywhere. Windows is excluded — the e2e venv-build tests
      # have a known file-lock issue tracked separately. Both steps run
      # in parallel workers; the e2e step spreads single tests (three
      # files would keep only three workers busy).
      - name: Run pytest (slow tier — e2e files)
        run: pytest -q -n auto --dist load --durations=15 tests/test_engine_smoke.py tests/test_self_correction_e2e.py tests/test_web_e2e.py
      # Treat pytest exit code 5 ("no tests collected") as success — if no
      # ``@pytest.mark.slow``-tagged test is left outside the three e2e
      # files (those land in the prior step), the step would otherwise
      # fail with rc=5 even though nothing is wrong.
      - name: Run pytest (slow tier — marker-tagged tests outside e2e files)
        run: |
          rc=0
          pytest -q -m slow -n auto --dist loadfile --durations=15 --ignore=tests/test_engine_smoke.py --ignore=tests/test_self_correction_e2e.py --ignore=tests/test_web_e2e.py || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi

  # ---- VSCode extension compile + package (PRs touching extension only) ------
  extension:
    name: vscode extension compile
    # Run on any PR that touches the extension. Catches
    # TypeScript syntax / type errors before merge — without this,
    # extension-only PRs were merged blind (vsix-rebuild.yml runs
    # only post-merge on main).
    if: |
      contains(toJSON(github.event.commits.*.modified), 'vscode-frontier-insight/') ||
      contains(toJSON(github.event.commits.*.added), 'vscode-frontier-insight/') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-frontier-insight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-frontier-insight/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      # The tests that drive the compiled extension in Node (finding FI, the work folder, activation). The pytest
      # tiers have no compiled out/, so there they skip; here a skip is a failure.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Run the tests that drive the compiled extension
        working-directory: .
        shell: bash
        run: |
          set -eo pipefail
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python -m pytest -q -rs -p no:cacheprovider tests/test_vscode_roots.py tests/test_vscode_activation.py | tee "$RUNNER_TEMP/ext-tests.txt"
          if grep -qE "[0-9]+ (skipped|error|errors|failed)" "$RUNNER_TEMP/ext-tests.txt"; then
            echo "::error::extension tests were skipped or failed"; exit 1
          fi

      # Package (vsce + the normalizer, so a broken normalizer fails here, before merge) and compare the files packed
      # inside with the committed manifest. A difference is a notice: after a merge, main's rebuild workflow builds the
      # .vsix from the sources and commits it (it also runs when a commit changes the .vsix or its manifest directly).
      - name: Package .vsix and compare its files with the committed manifest
        run: |
          cp vscode-frontier-insight.vsix.manifest.json "$RUNNER_TEMP/committed.manifest.json"
          npm run package
          if ! node scripts/check-vsix-manifest.js vscode-frontier-insight.vsix.manifest.json "$RUNNER_TEMP/committed.manifest.json"; then
            echo "::notice::the packed files differ from the committed .vsix; main's rebuild workflow commits one built from the sources after merge"
          fi
