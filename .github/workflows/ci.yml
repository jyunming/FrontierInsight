name: CI

# Runs the fast pytest tier on every PR and on push to main. The slow
# tier (e2e tests that build a real venv per tmp_path, knowledge-
# writeback flow, real `tenacity` waits) is gated behind the `slow`
# marker and runs only on push to main where wall-clock budget is
# less tight. Audit #07 recommended this split.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "outputs/**"
      - "vscode-frontier-insight/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "outputs/**"
      - "vscode-frontier-insight/**"

jobs:
  fast:
    name: pytest (fast tier)
    strategy:
      # Don't kill the whole matrix when one OS fails — Windows has
      # specific quirks (file locks) we want to see independently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The fast tier excludes:
      #   - tests/test_engine_smoke.py    (real venv builds, 50-63s each)
      #   - tests/test_self_correction_e2e.py
      #   - tests/test_web_e2e.py
      #   - any test tagged @pytest.mark.slow
      - name: Run pytest (fast tier)
        run: pytest -q -m "not slow" --ignore=tests/test_engine_smoke.py --ignore=tests/test_self_correction_e2e.py --ignore=tests/test_web_e2e.py

  slow:
    # Only run the slow tier post-merge to main. PRs get fast-tier
    # feedback in ~1-2 min; main gets the full coverage in ~5-10 min.
    name: pytest (slow tier, ubuntu only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [fast]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Slow tier runs the e2e files the fast tier skips. Windows is
      # excluded — the e2e venv-build tests have a known file-lock
      # issue (audit #07) that's tracked separately.
      - name: Run pytest (slow tier)
        run: pytest -q tests/test_engine_smoke.py tests/test_self_correction_e2e.py tests/test_web_e2e.py
