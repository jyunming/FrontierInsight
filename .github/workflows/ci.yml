name: CI

# Runs the fast pytest tier on every PR and on push to main. The slow
# tier (e2e tests that build a real venv per tmp_path, knowledge-
# writeback flow, real `tenacity` waits, plus anything tagged
# `@pytest.mark.slow`) runs only on push to main where wall-clock
# budget is less tight.
#
# Extension-only PRs (touching just `vscode-frontier-insight/**`) get
# their own TypeScript-compile job so they aren't merged blind — the
# `vsix-rebuild.yml` workflow only runs post-merge.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "outputs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "outputs/**"

# Cancel a PR's in-flight CI when a new commit is pushed to the same PR — no
# point spending minutes on a superseded diff. Main-branch runs are NOT
# cancelled (each push to main is a distinct gating run we want to complete),
# because the group keys on the ref and cancel-in-progress is gated to PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- Python pytest (fast tier) -----------------------------------
  fast:
    name: pytest (fast tier)
    # Skip when the change is extension-only — the `extension` job
    # below handles TS PRs on its own.
    if: |
      !contains(github.event.pull_request.title, '[ext-only]') &&
      !startsWith(github.event.head_commit.message, 'chore(vsix):')
    strategy:
      # Don't kill the whole matrix when one OS fails — Windows has
      # specific quirks (file locks) we want to see independently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ``[docker]`` extra is needed because ``tests/test_docker_executor.py``
      # uses ``patch("docker.from_env", ...)`` which resolves the
      # attribute at patch-enter time and requires the ``docker``
      # package to be importable even when the test doesn't actually
      # spawn a daemon.
      - name: Install package + dev + docker extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docker]

      # The fast tier excludes:
      #   - tests/test_engine_smoke.py    (real venv builds, 50-63s each)
      #   - tests/test_self_correction_e2e.py
      #   - tests/test_web_e2e.py
      #   - any test tagged @pytest.mark.slow
      # Coverage floor guards against a change that silently deletes tested
      # behaviour. Fast-tier line coverage of core+generation+launch measured
      # at 74%; the gate is set to 65% — comfortably below, so normal OS /
      # skipif variance doesn't flake CI, while a real coverage collapse
      # (a whole module going untested) still fails the build. Ratchet up as
      # coverage improves.
      - name: Run pytest (fast tier)
        run: >-
          pytest -q -m "not slow"
          --ignore=tests/test_engine_smoke.py
          --ignore=tests/test_self_correction_e2e.py
          --ignore=tests/test_web_e2e.py
          --cov=core --cov=generation --cov=launch
          --cov-report=term-missing:skip-covered
          --cov-fail-under=65

  # ---- Python pytest (slow tier) -----------------------------------
  slow:
    # Runs on both PRs and pushes to main so the slow tier gates the
    # merge. A post-merge-only gate misses regressions that only fail
    # in the slow tier (e.g. mode-reducer mismatches, or the rc=5
    # "no slow-tagged tests" exit). The wall-clock cost is +5-10 min
    # per PR, accepted to keep main green by construction.
    name: pytest (slow tier, ubuntu only)
    runs-on: ubuntu-latest
    needs: [fast]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev + docker extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docker]

      # Slow tier covers BOTH (a) the three e2e files the fast tier
      # skips by path AND (b) every test tagged @pytest.mark.slow
      # outside those files. Without the second pytest invocation, a
      # `slow`-tagged provider-retry / knowledge-writeback test would
      # be excluded by the fast tier's `-m "not slow"` filter AND
      # missed by the slow tier's file allowlist — never running
      # anywhere. Windows is excluded — the e2e venv-build tests
      # have a known file-lock issue tracked separately.
      - name: Run pytest (slow tier — e2e files)
        run: pytest -q tests/test_engine_smoke.py tests/test_self_correction_e2e.py tests/test_web_e2e.py
      # Treat pytest exit code 5 ("no tests collected") as success — the
      # repo currently has no ``@pytest.mark.slow``-tagged tests outside
      # the three e2e files (those land in the prior step). Without this
      # guard the step fails with rc=5 even though zero tests ran. When
      # someone adds the first slow-tagged test outside e2e, this step
      # will start exercising it automatically.
      - name: Run pytest (slow tier — marker-tagged tests outside e2e files)
        run: |
          rc=0
          pytest -q -m slow --ignore=tests/test_engine_smoke.py --ignore=tests/test_self_correction_e2e.py --ignore=tests/test_web_e2e.py || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi

  # ---- VSCode extension compile (PRs touching extension only) ------
  extension:
    name: vscode extension compile
    # Run on any PR or main push that touches the extension. Catches
    # TypeScript syntax / type errors before merge — without this,
    # extension-only PRs were merged blind (vsix-rebuild.yml runs
    # only post-merge on main).
    if: |
      contains(toJSON(github.event.commits.*.modified), 'vscode-frontier-insight/') ||
      contains(toJSON(github.event.commits.*.added), 'vscode-frontier-insight/') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-frontier-insight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-frontier-insight/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile
