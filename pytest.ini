[pytest]
asyncio_mode = auto
testpaths = tests
# --strict-markers: an unregistered/typo'd @pytest.mark.foo fails instead of
#   silently being a no-op filter (a `@pytest.mark.slwo` test would otherwise
#   run in the fast tier forever). --strict-config: an unknown ini key fails
#   instead of being ignored. Both catch config drift at collection time.
addopts = --basetemp=./.pytest_tmp --strict-markers --strict-config
markers =
    slow: tests that take >1s — e2e flows, real tenacity waits, real
        venv builds. Excluded from the PR CI fast tier; run only on
        push to main.
