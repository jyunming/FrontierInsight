[pytest]
asyncio_mode = auto
# Every async fixture gets its own event loop, per test; none needs a wider one.
asyncio_default_fixture_loop_scope = function
testpaths = tests
# A test still running after 10 minutes fails with its name (pytest-timeout) instead of stalling the whole
# shard; the slowest fast-tier test takes about 70 s on CI. The three e2e files mark themselves longer.
timeout = 600
# --strict-markers: an unregistered/typo'd @pytest.mark.foo fails instead of
#   silently being a no-op filter (a `@pytest.mark.slwo` test would otherwise
#   run in the fast tier forever). --strict-config: an unknown ini key fails
#   instead of being ignored. Both catch config drift at collection time.
addopts = --basetemp=./.pytest_tmp --strict-markers --strict-config
markers =
    slow: tests that take >1s — e2e flows, real tenacity waits, real
        venv builds. Excluded from the fast tier; the slow tier runs
        them on ubuntu for every code PR.
