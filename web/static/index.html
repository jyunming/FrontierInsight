<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontier Insight</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/header.js"></script>
</head>
<body>
  <div id="fi-header-root"></div>
  <main>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:0.5rem;">
      <div>
        <h1>Research Quests</h1>
        <p class="fi-subtitle">All quests in this output directory. Click one to see live status, the paper preview, and figures.</p>
      </div>
      <a class="fi-btn fi-btn-primary" href="/interview">+ New Quest</a>
    </div>

    <div id="filter-bar" style="display:flex; gap:0.5rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap">
      <input type="text" id="search" placeholder="Search by quest_id or provider…"
             oninput="applyFilter()"
             style="flex:1; min-width:200px; padding:0.4rem 0.75rem; border:1px solid var(--fi-border); border-radius:var(--fi-radius); background:var(--fi-bg); color:var(--fi-text); font-family:inherit; font-size:0.875rem">
      <select id="status-filter" onchange="applyFilter()"
              style="padding:0.4rem 0.6rem; border:1px solid var(--fi-border); border-radius:var(--fi-radius); background:var(--fi-bg); color:var(--fi-text); font-family:inherit; font-size:0.875rem">
        <option value="">All statuses</option>
        <option value="complete">Complete</option>
        <option value="(running)">In progress</option>
        <option value="revise">Needs revision</option>
      </select>
      <select id="sort-by" onchange="applyFilter()"
              style="padding:0.4rem 0.6rem; border:1px solid var(--fi-border); border-radius:var(--fi-radius); background:var(--fi-bg); color:var(--fi-text); font-family:inherit; font-size:0.875rem">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="alpha">By quest_id (A–Z)</option>
      </select>
      <span class="fi-card-meta" id="result-count" style="margin-left:auto"></span>
    </div>

    <div id="empty-banner" class="fi-empty" style="display:none">
      <p>No quests yet.</p>
      <p style="margin-top:0.5rem;">
        <a class="fi-btn fi-btn-primary" href="/interview">Start your first quest</a>
      </p>
    </div>

    <div id="quest-list"></div>
  </main>

  <script>
    let allQuests = [];

    async function loadQuests() {
      const res = await fetch('/api/quests');
      const data = await res.json();
      allQuests = data.quests || [];
      applyFilter();
    }

    function applyFilter() {
      const empty = document.getElementById('empty-banner');
      const list = document.getElementById('quest-list');
      const count = document.getElementById('result-count');
      if (allQuests.length === 0) {
        empty.style.display = '';
        list.innerHTML = '';
        count.textContent = '';
        return;
      }
      const search = (document.getElementById('search').value || '').toLowerCase();
      const status = document.getElementById('status-filter').value || '';
      const sortBy = document.getElementById('sort-by').value || 'newest';
      let filtered = allQuests.filter(q => {
        if (search && !`${q.quest_id} ${q.provider || ''}`.toLowerCase().includes(search)) return false;
        if (status && q.verdict !== status) return false;
        return true;
      });
      if (sortBy === 'oldest') filtered.sort((a, b) => (b.age_s || 0) - (a.age_s || 0));
      else if (sortBy === 'alpha') filtered.sort((a, b) => a.quest_id.localeCompare(b.quest_id));
      else filtered.sort((a, b) => (a.age_s || 0) - (b.age_s || 0));
      empty.style.display = 'none';
      list.innerHTML = filtered.map(renderQuestCard).join('') ||
        '<div class="fi-empty">No quests match the filter.</div>';
      count.textContent = `${filtered.length} of ${allQuests.length} quest${allQuests.length === 1 ? '' : 's'}`;
    }

    function renderQuestCard(q) {
      // The /api/quests scan endpoint returns: quest_id, quest_root,
      // verdict, score, provider, has_paper, age_s. The detail
      // endpoint /api/quests/<id> additionally carries `alive` +
      // `pending_clarify` + current_node + log_tail. The dashboard
      // intentionally only consumes scan-endpoint fields so the
      // listing stays cheap (no per-quest registry lookup).
      const state = describeState(q);
      const provider = q.provider
        ? `<span class="fi-mono">${escapeHtml(q.provider)}</span>`
        : '';
      const ageHint = q.age_s != null
        ? `${formatAge(q.age_s)} ago`
        : '';
      const paperHint = q.has_paper ? '<span class="fi-badge fi-badge-done">paper.md</span>' : '';
      return `
        <a class="fi-card" href="/quest/${encodeURIComponent(q.quest_id)}" style="display:block; text-decoration:none; color:inherit;">
          <div class="fi-card-title">
            <h3>${escapeHtml(q.quest_id)}</h3>
            <span class="fi-badge ${state.badgeClass}">${escapeHtml(state.label)}</span>
          </div>
          <div class="fi-card-meta">
            ${provider}${provider && ageHint ? ' · ' : ''}${ageHint}
            ${q.score != null ? ' · score ' + escapeHtml(String(q.score)) : ''}
          </div>
          <div style="margin-top:0.4rem">${paperHint}</div>
        </a>
      `;
    }

    function describeState(q) {
      // verdict comes from frontier_insight_summary.json — present
      // only when the quest has reached a terminal state.
      // "(running)" is the placeholder set by _scan_quests when no
      // summary exists yet.
      if (q.verdict === 'complete' || q.verdict === 'accept') {
        return { label: 'complete', badgeClass: 'fi-badge-done' };
      }
      if (q.verdict === 'revise') {
        return { label: 'revise', badgeClass: 'fi-badge-paused' };
      }
      if (q.verdict === '(running)') {
        return { label: 'in progress', badgeClass: 'fi-badge-alive' };
      }
      return { label: String(q.verdict || 'idle'), badgeClass: '' };
    }

    function formatAge(s) {
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.round(s / 60)}m`;
      if (s < 86400) return `${Math.round(s / 3600)}h`;
      return `${Math.round(s / 86400)}d`;
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    loadQuests();
    setInterval(loadQuests, 5000);
  </script>
</body>
</html>
