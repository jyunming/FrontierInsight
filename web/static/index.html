<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontier Insight</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/header.js"></script>
</head>
<body>
  <div id="fi-header-root"></div>
  <main>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:0.5rem;">
      <div>
        <h1>Research Quests</h1>
        <p class="fi-subtitle">All quests in this output directory. Click one to see live status, the paper preview, and figures.</p>
      </div>
      <a class="fi-btn fi-btn-primary" href="/interview">+ New Quest</a>
    </div>

    <div id="empty-banner" class="fi-empty" style="display:none">
      <p>No quests yet.</p>
      <p style="margin-top:0.5rem;">
        <a class="fi-btn fi-btn-primary" href="/interview">Start your first quest</a>
      </p>
    </div>

    <div id="quest-list"></div>
  </main>

  <script>
    async function loadQuests() {
      const res = await fetch('/api/quests');
      const data = await res.json();
      const list = document.getElementById('quest-list');
      const empty = document.getElementById('empty-banner');
      const quests = data.quests || [];
      if (quests.length === 0) {
        empty.style.display = '';
        list.innerHTML = '';
        return;
      }
      empty.style.display = 'none';
      list.innerHTML = quests.map(renderQuestCard).join('');
    }

    function renderQuestCard(q) {
      const state = describeState(q);
      const updatedHint = q.last_log_ts
        ? `last log <span class="fi-mono">${escapeHtml(q.last_log_ts)}</span>`
        : '';
      const provider = q.provider
        ? `<span class="fi-mono">${escapeHtml(q.provider)}</span>`
        : '';
      const node = q.current_node
        ? ` · node <span class="fi-mono">${escapeHtml(q.current_node)}</span>`
        : '';
      return `
        <a class="fi-card" href="/quest/${encodeURIComponent(q.quest_id)}" style="display:block; text-decoration:none; color:inherit;">
          <div class="fi-card-title">
            <h3>${escapeHtml(q.title || q.quest_id)}</h3>
            <span class="fi-badge ${state.badgeClass}">${escapeHtml(state.label)}</span>
          </div>
          <div class="fi-card-meta">
            <span class="fi-mono">${escapeHtml(q.quest_id)}</span>
            ${provider ? ' · ' + provider : ''}${node}
            ${updatedHint ? ' · ' + updatedHint : ''}
          </div>
        </a>
      `;
    }

    function describeState(q) {
      if (q.alive) return { label: 'running', badgeClass: 'fi-badge-alive' };
      if (q.pending_clarify) return { label: 'paused (clarify)', badgeClass: 'fi-badge-paused' };
      if (q.complete) return { label: 'complete', badgeClass: 'fi-badge-done' };
      return { label: 'idle', badgeClass: '' };
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    loadQuests();
    setInterval(loadQuests, 5000);
  </script>
</body>
</html>
