<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Frontier Insight — Compare</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="/static/theme.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="/static/style.css"/>
<script defer src="/static/header.js"></script>
<script defer src="/static/md_lite.js"></script>
</head>
<body class="font-body text-on-surface min-h-screen antialiased">
<div id="fi-header-root" data-breadcrumb="Compare"></div>
<main class="max-w-[1440px] mx-auto px-6 md:px-10 pt-28 pb-24">

<section class="fi-page-hero">
  <h1>Compare two quests</h1>
  <p class="fi-subtitle">Side-by-side paper preview, verdict, and cost. Useful for "did my tweak help?" — pick two quests from the dropdowns or pass <code class="font-mono text-cyan-accent">?a=…&amp;b=…</code> in the URL.</p>
</section>

<div class="flex items-center gap-3 mb-6 flex-wrap">
  <label class="font-mono text-label-mono text-on-surface-variant uppercase">A:</label>
  <select id="pick-a" onchange="loadBoth()" class="max-w-md"></select>
  <span class="text-on-surface-variant font-mono text-label-mono uppercase">vs</span>
  <label class="font-mono text-label-mono text-on-surface-variant uppercase">B:</label>
  <select id="pick-b" onchange="loadBoth()" class="max-w-md"></select>
</div>

<div class="grid lg:grid-cols-2 gap-4">
  <div class="hairline-gradient p-6 rounded-xl max-h-[70vh] overflow-y-auto">
    <h3 id="title-a" class="font-mono text-headline-md text-on-surface mb-1 truncate"></h3>
    <p id="meta-a" class="font-mono text-label-mono text-on-surface-variant uppercase mb-4"></p>
    <h4 class="font-display font-bold mb-2">Paper</h4>
    <div class="fi-md-body" id="paper-a"></div>
  </div>
  <div class="hairline-gradient p-6 rounded-xl max-h-[70vh] overflow-y-auto">
    <h3 id="title-b" class="font-mono text-headline-md text-on-surface mb-1 truncate"></h3>
    <p id="meta-b" class="font-mono text-label-mono text-on-surface-variant uppercase mb-4"></p>
    <h4 class="font-display font-bold mb-2">Paper</h4>
    <div class="fi-md-body" id="paper-b"></div>
  </div>
</div>

</main>

<script>
  async function init() {
    const res = await fetch('/api/quests');
    const data = await res.json();
    const quests = data.quests || [];
    const a = document.getElementById('pick-a');
    const b = document.getElementById('pick-b');
    for (const sel of [a, b]) {
      sel.innerHTML = '<option value="">(pick a quest)</option>'
        + quests.map(q => `<option value="${q.quest_id}">${q.quest_id}</option>`).join('');
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('a')) a.value = params.get('a');
    if (params.get('b')) b.value = params.get('b');
    if (a.value || b.value) loadBoth();
  }

  async function loadBoth() {
    const a = document.getElementById('pick-a').value;
    const b = document.getElementById('pick-b').value;
    if (a) loadOne(a, 'a');
    if (b) loadOne(b, 'b');
  }

  async function loadOne(qid, side) {
    const title = document.getElementById(`title-${side}`);
    const meta = document.getElementById(`meta-${side}`);
    const paper = document.getElementById(`paper-${side}`);
    title.textContent = qid;
    try {
      const res = await fetch(`/api/quests/${encodeURIComponent(qid)}`);
      if (!res.ok) {
        meta.textContent = `Error ${res.status}`;
        paper.innerHTML = '';
        return;
      }
      const data = await res.json();
      const verdict = data.review?.verdict || data.summary?.verdict || '(no review)';
      const score = data.review?.score ?? '?';
      const cost = await fetchCost(qid);
      meta.textContent = `verdict: ${verdict} · score ${score} · cost $${cost.toFixed(4)}`;
      if (data.paper_preview && window.fi_renderMarkdown) {
        paper.innerHTML = window.fi_renderMarkdown(data.paper_preview);
      } else {
        paper.textContent = data.paper_preview || '(no paper yet)';
      }
    } catch (e) {
      meta.textContent = `Error: ${e}`;
      paper.innerHTML = '';
    }
  }

  async function fetchCost(qid) {
    try {
      const res = await fetch(`/api/quests/${encodeURIComponent(qid)}/cost`);
      if (!res.ok) return 0;
      const data = await res.json();
      return (data.records || []).reduce((s, r) => s + (r.cost_usd || 0), 0);
    } catch (_) { return 0; }
  }

  init();
</script>
</body>
</html>
