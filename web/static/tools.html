<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tool — Frontier Insight</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="/static/theme.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config = window._fiConfig;</script>
<link rel="stylesheet" href="/static/style.css"/>
<script defer src="/static/header.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">

<div id="fi-header-root"></div>

<main class="flex-grow flex flex-col items-center w-full px-margin-mobile md:px-margin-desktop py-12 max-w-max-width mx-auto bg-cyber-gradient">

  <section class="w-full max-w-4xl mb-section-gap pt-8">
    <div class="flex items-center gap-3 text-secondary mb-4 font-label-sm text-label-sm uppercase tracking-widest">
      <span class="material-symbols-outlined text-[16px]">psychiatry</span>
      <span id="tool-route"></span>
    </div>
    <h1 id="tool-title" class="font-headline-xl text-headline-lg-mobile md:text-headline-xl text-on-surface mb-6 leading-tight">Loading…</h1>
    <p id="tool-blurb" class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl"></p>
  </section>

  <form id="tool-form" onsubmit="return submit(event);" enctype="multipart/form-data" class="w-full max-w-4xl space-y-8 mb-section-gap"></form>

  <div id="result" class="w-full max-w-4xl hidden"></div>

</main>

<footer class="full-width bottom-0 bg-surface-low/60 backdrop-blur-[20px] border-t border-white/10 mt-auto">
  <div class="flex flex-col md:flex-row justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-component-padding-md max-w-max-width mx-auto">
    <div class="text-label-sm font-bold text-on-surface mb-4 md:mb-0">Frontier Insight</div>
    <div class="font-label-sm text-label-sm text-on-surface-variant flex flex-wrap justify-center gap-4 md:gap-8 mb-4 md:mb-0">
      <a class="hover:text-secondary transition-colors" href="/">Dashboard</a>
      <a class="hover:text-secondary transition-colors" href="/settings">Settings</a>
      <a class="hover:text-secondary transition-colors" href="https://github.com/jyunming/FrontierInsight" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div class="font-label-sm text-label-sm text-on-surface-variant opacity-70">© 2026 Frontier Insight · Apache 2.0</div>
  </div>
</footer>

<script>
  const toolName = window.__fi_tool_name;
  let spec = null;
  let allQuests = [];
  let providerSchema = null;

  async function load() {
    const res = await fetch('/api/tools/schema');
    const data = await res.json();
    spec = data.tools.find(t => t.name === toolName);
    if (!spec) {
      document.getElementById('tool-title').textContent = 'Unknown tool';
      document.getElementById('tool-blurb').textContent = `No spec found for "${toolName}".`;
      return;
    }
    document.getElementById('tool-route').textContent = `/tools/${spec.name}`;
    // Stitch's hero title is "Name — blurb" formatted. Replicate that:
    const labelParts = spec.label.split('—');
    document.getElementById('tool-title').innerHTML = `${escapeHtml(labelParts[0].trim())}${labelParts.length > 1 ? ` <span class="text-on-surface-variant font-normal">— ${escapeHtml(labelParts.slice(1).join('—').trim())}</span>` : ''}`;
    document.getElementById('tool-blurb').textContent = spec.blurb;
    if (spec.fields.some(f => f.kind === 'quest_picker')) {
      try { allQuests = (await fetch('/api/quests').then(r => r.json())).quests || []; } catch (_) {}
    }
    if (spec.needs_llm) {
      try { providerSchema = await fetch('/api/interview/schema').then(r => r.json()); } catch (_) {}
    }
    renderForm();
  }

  function renderForm() {
    const form = document.getElementById('tool-form');
    form.innerHTML = '';
    // Group all spec fields into one fieldset (Context & Inputs).
    if (spec.fields.length > 0) {
      const fs = makeFieldset('Context & Inputs', 'The inputs this tool consumes.', /* active = */ true);
      for (const field of spec.fields) {
        fs.querySelector('.fields-grid').appendChild(makeField(field));
      }
      form.appendChild(fs);
    }
    // Provider/model picker as its own Execution Engine fieldset.
    if (spec.needs_llm && providerSchema) {
      const fs = makeFieldset('Execution Engine', 'Pick the LLM provider and model. Defaults to the first available on this host.', /* active = */ false);
      const grid = fs.querySelector('.fields-grid');
      grid.classList.remove('grid-cols-1');
      grid.classList.add('grid-cols-1', 'md:grid-cols-2');
      grid.appendChild(makeProviderPicker(providerSchema.providers || []));
      grid.appendChild(makeModelPicker());
      form.appendChild(fs);
    }
    // Submit row.
    const row = document.createElement('div');
    row.className = 'pt-8 pb-4 flex justify-end';
    row.innerHTML = `
      <button type="submit" class="relative group overflow-hidden rounded-lg bg-gradient-to-r from-primary-container to-secondary-container px-8 py-4 font-label-sm text-label-sm uppercase tracking-wider text-white shadow-[0_0_20px_rgba(79,70,229,0.4)] hover:shadow-[0_0_30px_rgba(79,70,229,0.6)] transition-shadow">
        <span class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">play_arrow</span>
          <span>Run ${escapeHtml((spec.label || spec.name).split('—')[0].trim())}</span>
        </span>
      </button>
    `;
    form.appendChild(row);
  }

  function makeFieldset(title, blurb, active) {
    const fs = document.createElement('fieldset');
    fs.className = `bg-surface-mid rounded-xl p-8 hairline-gradient ${active ? 'hairline-gradient-active' : ''} relative overflow-hidden`;
    fs.innerHTML = `
      <legend class="font-headline-lg text-2xl text-on-surface mb-6 pb-4 border-b border-surface-high w-full flex items-center gap-3">
        <span class="w-2 h-8 ${active ? 'bg-gradient-to-b from-primary to-secondary' : 'bg-surface-high'} rounded-full inline-block"></span>
        ${escapeHtml(title)}
      </legend>
      <p class="font-body-md text-body-md text-outline italic mb-6">${escapeHtml(blurb)}</p>
      <div class="fields-grid grid grid-cols-1 gap-6"></div>
    `;
    return fs;
  }

  function makeField(field) {
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col gap-2';
    const labelHtml = `<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="f-${field.name}">${escapeHtml(field.label || field.name)}${field.required === false ? ' (optional)' : ''}</label>`;
    let inputHtml = '';
    if (field.kind === 'longtext') {
      inputHtml = `<textarea id="f-${field.name}" name="${field.name}" rows="4" placeholder="${escapeAttr(field.placeholder || '')}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-4 font-body-md text-on-surface placeholder-outline focus:outline-none input-glow transition-all resize-none">${escapeHtml(field.default ?? '')}</textarea>`;
    } else if (field.kind === 'int') {
      inputHtml = `<input id="f-${field.name}" name="${field.name}" type="number" value="${escapeAttr(field.default ?? '')}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 px-4 font-code-md text-code-md text-on-surface focus:outline-none input-glow transition-all"/>`;
    } else if (field.kind === 'file') {
      inputHtml = `<label class="flex items-center justify-center w-full h-[50px] bg-surface-low border border-dashed border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors group">
        <div class="flex items-center gap-2 text-outline group-hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[20px]">upload_file</span>
          <span class="font-code-md text-code-md">Upload file…</span>
        </div>
        <input id="f-${field.name}" name="${field.name}" type="file" class="hidden"/>
      </label>`;
    } else if (field.kind === 'files') {
      inputHtml = `<label class="flex items-center justify-center w-full h-[50px] bg-surface-low border border-dashed border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors group">
        <div class="flex items-center gap-2 text-outline group-hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[20px]">upload_file</span>
          <span class="font-code-md text-code-md">Upload one or more files…</span>
        </div>
        <input id="f-${field.name}" name="${field.name}" type="file" multiple class="hidden"/>
      </label>`;
    } else if (field.kind === 'quest_picker') {
      const opts = allQuests.map(q => `<option value="${escapeAttr(q.quest_id)}">${escapeHtml(q.quest_id)} (${escapeHtml(q.verdict || 'idle')})</option>`).join('');
      inputHtml = `<div class="relative">
        <select id="f-${field.name}" name="${field.name}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 pl-4 pr-10 font-code-md text-code-md text-on-surface appearance-none focus:outline-none input-glow transition-all">
          <option value="">(pick a quest)</option>${opts}
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
      </div>`;
    } else {
      inputHtml = `<input id="f-${field.name}" name="${field.name}" type="text" value="${escapeAttr(field.default ?? '')}" placeholder="${escapeAttr(field.placeholder || '')}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 px-4 font-code-md text-code-md text-on-surface focus:outline-none input-glow transition-all"/>`;
    }
    wrap.innerHTML = labelHtml + inputHtml + (field.prompt ? `<p class="font-body-md text-body-md text-outline italic">${escapeHtml(field.prompt)}</p>` : '');
    return wrap;
  }

  function makeProviderPicker(providers) {
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col gap-2';
    const opts = providers.map(p => `<option value="${escapeAttr(p.value)}">${escapeHtml(p.label)}</option>`).join('');
    wrap.innerHTML = `
      <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="f-provider">Provider</label>
      <div class="relative">
        <select id="f-provider" name="provider" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 pl-4 pr-10 font-code-md text-code-md text-on-surface appearance-none focus:outline-none input-glow transition-all">
          <option value="">(pick one)</option>${opts}
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
      </div>
    `;
    wrap.querySelector('select').addEventListener('change', (e) => {
      const models = (providerSchema.provider_models || {})[e.target.value] || [];
      const msel = document.getElementById('f-provider_model');
      msel.innerHTML = '<option value="">' + (models.length ? '(pick a model)' : '(none for this provider)') + '</option>'
        + models.map(m => `<option value="${escapeAttr(m.value)}">${escapeHtml(m.label)}</option>`).join('');
    });
    return wrap;
  }

  function makeModelPicker() {
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col gap-2';
    wrap.innerHTML = `
      <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="f-provider_model">Model (optional)</label>
      <div class="relative">
        <select id="f-provider_model" name="provider_model" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 pl-4 pr-10 font-code-md text-code-md text-on-surface appearance-none focus:outline-none input-glow transition-all">
          <option value="">(pick a provider first)</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
      </div>
    `;
    return wrap;
  }

  async function submit(ev) {
    ev.preventDefault();
    const form = document.getElementById('tool-form');
    const fd = new FormData(form);
    const result = document.getElementById('result');
    result.classList.remove('hidden');
    result.className = 'w-full max-w-4xl fi-banner fi-banner-info';
    result.textContent = `Running ${spec.label}…`;
    const res = await fetch(`/api/tools/${spec.name}`, { method: 'POST', body: fd });
    if (!res.ok) {
      result.className = 'w-full max-w-4xl fi-banner fi-banner-error';
      result.textContent = `Error ${res.status}: ${await res.text()}`;
      return false;
    }
    const body = await res.json();
    result.className = 'w-full max-w-4xl fi-banner fi-banner-info';
    result.innerHTML = `
      <p class="mb-2"><b>Job started.</b> Job ID: <code class="font-code-md">${escapeHtml(body.job_id)}</code> · pid ${body.pid}</p>
      <p class="mb-2 text-on-surface-variant">argv: <code class="font-code-md">${escapeHtml(JSON.stringify(body.argv_tail))}</code></p>
      ${body.artifact_dir ? `<p class="mb-3 text-on-surface-variant">Output will land under <code class="font-code-md">${escapeHtml(body.artifact_dir)}</code> when the job finishes.</p>` : ''}
      <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded font-label-sm text-label-sm uppercase bg-surface-mid border border-white/10 text-on-surface hover:bg-surface-high transition-colors">← Dashboard</a>
    `;
    return false;
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s); }

  load();
</script>
</body>
</html>
