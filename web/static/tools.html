<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tool — Frontier Insight</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&amp;family=Geist:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="/static/theme.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config = window._fiConfig;</script>
<link rel="stylesheet" href="/static/style.css"/>
<script defer src="/static/header.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">

<div id="fi-header-root"></div>

<main class="flex-grow flex flex-col items-center w-full px-margin-mobile md:px-margin-desktop py-12 max-w-max-width mx-auto bg-cyber-gradient">

  <section class="w-full max-w-4xl mb-section-gap pt-8">
    <div class="flex items-center gap-3 text-secondary mb-4 font-label-sm text-label-sm uppercase tracking-widest">
      <span class="material-symbols-outlined text-[16px]">psychiatry</span>
      <span id="tool-route"></span>
    </div>
    <h1 id="tool-title" class="font-headline-xl text-headline-lg-mobile md:text-headline-xl text-on-surface mb-6 leading-tight">Loading…</h1>
    <p id="tool-blurb" class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl"></p>
  </section>

  <form id="tool-form" onsubmit="return submitTool(event);" enctype="multipart/form-data" class="w-full max-w-4xl space-y-8 mb-section-gap"></form>

  <div id="result" class="w-full max-w-4xl hidden"></div>

</main>

<footer class="full-width bottom-0 bg-surface-low/60 backdrop-blur-[20px] border-t border-white/10 mt-auto">
  <div class="flex flex-col md:flex-row justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-component-padding-md max-w-max-width mx-auto">
    <div class="text-label-sm font-bold text-on-surface mb-4 md:mb-0">Frontier Insight</div>
    <div class="font-label-sm text-label-sm text-on-surface-variant flex flex-wrap justify-center gap-4 md:gap-8 mb-4 md:mb-0">
      <a class="hover:text-secondary transition-colors" href="/">Dashboard</a>
      <a class="hover:text-secondary transition-colors" href="/settings">Settings</a>
      <a class="hover:text-secondary transition-colors" href="https://github.com/jyunming/FrontierInsight" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div class="font-label-sm text-label-sm text-on-surface-variant opacity-70">© 2026 Frontier Insight · Apache 2.0</div>
  </div>
</footer>

<script>
  const toolName = window.__fi_tool_name;
  let spec = null;
  let allQuests = [];
  let providerSchema = null;
  // Whether the dashboard was launched from a VSCode terminal — when
  // true we surface `vscode_extension` as a provider option and let
  // VSCode's Chat model picker drive the model.
  let vscodeBridgeAvailable = false;
  // Extra model list for vscode_extension that's intentionally absent
  // from the interview's `provider_models` map (the interview never
  // asks about vscode_extension). Comes from /api/tools/schema.
  let vscodeExtensionModels = [];

  async function load() {
    const res = await fetch('/api/tools/schema');
    const data = await res.json();
    spec = data.tools.find(t => t.name === toolName);
    vscodeBridgeAvailable = !!data.vscode_bridge_available;
    vscodeExtensionModels = data.vscode_extension_models || [];
    if (!spec) {
      document.getElementById('tool-title').textContent = 'Unknown tool';
      document.getElementById('tool-blurb').textContent = `No spec found for "${toolName}".`;
      return;
    }
    document.getElementById('tool-route').textContent = `/tools/${spec.name}`;
    // Stitch's hero title is "Name — blurb" formatted. Replicate that:
    const labelParts = spec.label.split('—');
    document.getElementById('tool-title').innerHTML = `${escapeHtml(labelParts[0].trim())}${labelParts.length > 1 ? ` <span class="text-on-surface-variant font-normal">— ${escapeHtml(labelParts.slice(1).join('—').trim())}</span>` : ''}`;
    document.getElementById('tool-blurb').textContent = spec.blurb;
    if (spec.fields.some(f => f.kind === 'quest_picker')) {
      try { allQuests = (await fetch('/api/quests').then(r => r.json())).quests || []; } catch (_) {}
    }
    if (spec.needs_llm) {
      try { providerSchema = await fetch('/api/interview/schema').then(r => r.json()); } catch (_) {}
    }
    renderForm();
  }

  function renderForm() {
    const form = document.getElementById('tool-form');
    form.innerHTML = '';
    // Group all spec fields into one fieldset (Context & Inputs).
    if (spec.fields.length > 0) {
      const fs = makeFieldset('Context & Inputs', 'The inputs this tool consumes.', /* active = */ true);
      for (const field of spec.fields) {
        fs.querySelector('.fields-grid').appendChild(makeField(field));
      }
      form.appendChild(fs);
    }
    // Provider/model picker as its own Execution Engine fieldset.
    if (spec.needs_llm && providerSchema) {
      const fs = makeFieldset('Execution Engine', 'Pick the LLM provider and model. Defaults to the first available on this host.', /* active = */ false);
      const grid = fs.querySelector('.fields-grid');
      grid.classList.remove('grid-cols-1');
      grid.classList.add('grid-cols-1', 'md:grid-cols-2');
      // Augment provider list with vscode_extension when the dashboard
      // was launched from a VSCode terminal. /api/interview/schema
      // already injects it at the head when bridge is wired, so first
      // check whether it's there; only prepend if absent (older /serve
      // builds may not augment that schema).
      let providers = (providerSchema.providers || []).slice();
      const alreadyHasVscode = providers.some(p => p.value === 'vscode_extension');
      if (vscodeBridgeAvailable && !alreadyHasVscode) {
        providers = [{
          value: 'vscode_extension',
          label: 'vscode_extension — sanctioned Copilot Chat bridge',
          description: 'Routes every LLM call through vscode.lm on your authenticated Copilot session. Available because this dashboard was launched from a VSCode terminal.',
        }, ...providers];
      }
      grid.appendChild(makeProviderPicker(providers));
      grid.appendChild(makeModelPicker());
      // Only the two tools whose CLI accept --<tool>-ensemble can
      // honour the picker. Surfacing it elsewhere would silently
      // discard the user's choice. Other LLM tools need core-side
      // ensemble wiring before they can join.
      if (spec.name === 'proposal' || spec.name === 'critique') {
        grid.appendChild(makeEnsemblePicker(providerSchema.ensemble_profiles || []));
      }
      form.appendChild(fs);
    }
    // Submit row.
    const row = document.createElement('div');
    row.className = 'pt-8 pb-4 flex justify-end';
    row.innerHTML = `
      <button type="submit" class="relative group overflow-hidden rounded-lg bg-gradient-to-r from-primary-container to-secondary-container px-8 py-4 font-label-sm text-label-sm uppercase tracking-wider text-white shadow-[0_0_20px_rgba(79,70,229,0.4)] hover:shadow-[0_0_30px_rgba(79,70,229,0.6)] transition-shadow">
        <span class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">play_arrow</span>
          <span>Run ${escapeHtml((spec.label || spec.name).split('—')[0].trim())}</span>
        </span>
      </button>
    `;
    form.appendChild(row);
  }

  function makeFieldset(title, blurb, active) {
    const fs = document.createElement('fieldset');
    fs.className = `bg-surface-mid rounded-xl p-8 hairline-gradient ${active ? 'hairline-gradient-active' : ''} relative overflow-hidden`;
    fs.innerHTML = `
      <legend class="font-headline-lg text-2xl text-on-surface mb-6 pb-4 border-b border-surface-high w-full flex items-center gap-3">
        <span class="w-2 h-8 ${active ? 'bg-gradient-to-b from-primary to-secondary' : 'bg-surface-high'} rounded-full inline-block"></span>
        ${escapeHtml(title)}
      </legend>
      <p class="font-body-md text-body-md text-outline italic mb-6">${escapeHtml(blurb)}</p>
      <div class="fields-grid grid grid-cols-1 gap-6"></div>
    `;
    return fs;
  }

  function makeField(field) {
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col gap-2';
    const labelHtml = `<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="f-${field.name}">${escapeHtml(field.label || field.name)}${field.required === false ? ' (optional)' : ''}</label>`;
    let inputHtml = '';
    if (field.kind === 'longtext') {
      inputHtml = `<textarea id="f-${field.name}" name="${field.name}" rows="4" placeholder="${escapeAttr(field.placeholder || '')}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-4 font-body-md text-on-surface placeholder-outline focus:outline-none input-glow transition-all resize-none">${escapeHtml(field.default ?? '')}</textarea>`;
    } else if (field.kind === 'int') {
      inputHtml = `<input id="f-${field.name}" name="${field.name}" type="number" value="${escapeAttr(field.default ?? '')}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 px-4 font-code-md text-code-md text-on-surface focus:outline-none input-glow transition-all"/>`;
    } else if (field.kind === 'file') {
      inputHtml = `<label class="flex items-center justify-center w-full h-[50px] bg-surface-low border border-dashed border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors group">
        <div class="flex items-center gap-2 text-outline group-hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[20px]">upload_file</span>
          <span class="font-code-md text-code-md">Upload file…</span>
        </div>
        <input id="f-${field.name}" name="${field.name}" type="file" class="hidden"/>
      </label>`;
    } else if (field.kind === 'files') {
      inputHtml = `<label class="flex items-center justify-center w-full h-[50px] bg-surface-low border border-dashed border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors group">
        <div class="flex items-center gap-2 text-outline group-hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[20px]">upload_file</span>
          <span class="font-code-md text-code-md">Upload one or more files…</span>
        </div>
        <input id="f-${field.name}" name="${field.name}" type="file" multiple class="hidden"/>
      </label>`;
    } else if (field.kind === 'quest_picker') {
      const opts = allQuests.map(q => `<option value="${escapeAttr(q.quest_id)}">${escapeHtml(q.quest_id)} (${escapeHtml(q.verdict || 'idle')})</option>`).join('');
      inputHtml = `<div class="relative">
        <select id="f-${field.name}" name="${field.name}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 pl-4 pr-10 font-code-md text-code-md text-on-surface appearance-none focus:outline-none input-glow transition-all">
          <option value="">(pick a quest)</option>${opts}
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
      </div>`;
    } else {
      inputHtml = `<input id="f-${field.name}" name="${field.name}" type="text" value="${escapeAttr(field.default ?? '')}" placeholder="${escapeAttr(field.placeholder || '')}" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 px-4 font-code-md text-code-md text-on-surface focus:outline-none input-glow transition-all"/>`;
    }
    wrap.innerHTML = labelHtml + inputHtml + (field.prompt ? `<p class="font-body-md text-body-md text-outline italic">${escapeHtml(field.prompt)}</p>` : '');
    return wrap;
  }

  function makeProviderPicker(providers) {
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col gap-2';
    const opts = providers.map(p => `<option value="${escapeAttr(p.value)}" title="${escapeAttr(p.description || '')}">${escapeHtml(p.label)}</option>`).join('');
    // Provider does NOT get an "Other" option (parity with the main
    // interview's PROVIDER_CHOICES, which keeps allow_other=False).
    // Provider names map to concrete transports in core/provider.py;
    // accepting a free-text value would just crash at engine init.
    wrap.innerHTML = `
      <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="f-provider">Provider</label>
      <div class="relative">
        <select id="f-provider" name="provider" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 pl-4 pr-10 font-code-md text-code-md text-on-surface appearance-none focus:outline-none input-glow transition-all">
          <option value="">(pick one)</option>${opts}
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
      </div>
    `;
    const sel = wrap.querySelector('select');
    sel.addEventListener('change', (e) => {
      const v = e.target.value;
      void populateModelsFor(v);
    });
    return wrap;
  }

  // Populate the model picker for ``v``. Tries the live discovery
  // endpoint first (OpenAI /v1/models, Ollama /api/tags, ...) and
  // falls back to the static schema list when the endpoint returns
  // ``{source: "static"}``. Always appends an "Other" option so a
  // brand-new model not on either list is still typeable.
  async function populateModelsFor(provider) {
    const msel = document.getElementById('f-provider_model');
    if (!msel) return;
    const staticFallback = provider === 'vscode_extension'
      ? vscodeExtensionModels
      : ((providerSchema.provider_models || {})[provider] || []);
    // Render the static set first so the picker isn't blank while
    // the discovery fetch is in flight.
    renderModelOptions(msel, staticFallback, /* dynamicSource */ false);
    if (!provider) return;
    try {
      const res = await fetch(`/api/provider/models?provider=${encodeURIComponent(provider)}`);
      if (!res.ok) return;
      const body = await res.json();
      if (body.source === 'dynamic' && Array.isArray(body.models) && body.models.length) {
        renderModelOptions(msel, body.models, /* dynamicSource */ true);
      }
    } catch (_) { /* keep static fallback */ }
  }

  function renderModelOptions(msel, models, dynamicSource) {
    const blankLabel = models.length
      ? (dynamicSource ? '(pick a model — live)' : '(pick a model)')
      : '(none for this provider)';
    const otherModelOpt = '<option value="__OTHER__">Other (type your own)…</option>';
    msel.innerHTML = `<option value="">${blankLabel}</option>`
      + models.map(m => `<option value="${escapeAttr(m.value)}" title="${escapeAttr(m.description || '')}">${escapeHtml(m.label)}</option>`).join('')
      + otherModelOpt;
    handleOtherSelection(msel, 'Model');
  }

  function makeModelPicker() {
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col gap-2';
    wrap.innerHTML = `
      <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="f-provider_model">Model (optional)</label>
      <div class="relative">
        <select id="f-provider_model" name="provider_model" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 pl-4 pr-10 font-code-md text-code-md text-on-surface appearance-none focus:outline-none input-glow transition-all">
          <option value="">(pick a provider first)</option>
          <option value="__OTHER__">Other (type your own)…</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
      </div>
    `;
    wrap.querySelector('select').addEventListener('change', (e) => {
      handleOtherSelection(e.target, 'Model');
    });
    return wrap;
  }

  function makeEnsemblePicker(profiles) {
    // Profiles come from /api/interview/schema's `ensemble_profiles`.
    // Schema falls back to a static list so the picker still renders
    // if the interview-side endpoint is unreachable.
    const fallback = [
      { value: 'off',                 label: 'off — single model (cheapest)' },
      { value: 'cross_check_only',    label: 'cross_check only — fan out the cross_check node' },
      { value: 'ideate_and_check',    label: 'ideate + cross_check' },
      { value: 'full',                label: 'full — ideate + analyze + cross_check' },
    ];
    const list = profiles.length ? profiles : fallback;
    const opts = list.map(p => `<option value="${escapeAttr(p.value)}" title="${escapeAttr(p.description || '')}"${p.value === 'off' ? ' selected' : ''}>${escapeHtml(p.label)}</option>`).join('');
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col gap-2 md:col-span-2';
    wrap.innerHTML = `
      <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="f-ensemble_profile">Multi-model ensemble</label>
      <div class="relative">
        <select id="f-ensemble_profile" name="ensemble_profile" class="w-full bg-surface-low border border-outline-variant rounded-lg p-3 pl-4 pr-10 font-code-md text-code-md text-on-surface appearance-none focus:outline-none input-glow transition-all">
          ${opts}
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
      </div>
      <p class="font-body-md text-body-md text-outline italic">Fan out the LLM call across the picked provider's 3-model trio and merge. Cost multiplies; agreement signal increases.</p>
    `;
    return wrap;
  }

  // Reveal / hide a text input below a select when its value is the
  // sentinel `__OTHER__`. The input is reused on subsequent changes
  // and removed-by-hide (kept in the DOM so its value can be cleared
  // when the user reselects a curated option). Mirrors the pattern
  // interview.html uses so /tools and /interview behave the same.
  function handleOtherSelection(sel, fieldLabel) {
    const otherId = `${sel.id}-other`;
    let other = document.getElementById(otherId);
    if (sel.value === '__OTHER__') {
      if (!other) {
        other = document.createElement('input');
        other.type = 'text';
        other.id = otherId;
        other.name = `${sel.name}_other`;
        other.placeholder = `Type a ${fieldLabel.toLowerCase()} value…`;
        other.className = 'w-full bg-surface-low border border-outline-variant rounded-lg p-3 px-4 font-code-md text-code-md text-on-surface focus:outline-none input-glow transition-all mt-2';
        sel.parentElement.insertAdjacentElement('afterend', other);
      }
      other.style.display = '';
      other.focus();
    } else if (other) {
      other.style.display = 'none';
      other.value = '';
    }
  }

  // Named `submitTool` rather than `submit` — the bare `submit` name in
  // an inline onsubmit="" handler resolves to HTMLFormElement.prototype.submit
  // (which fires a default form submission) before our function definition,
  // so the form did a silent GET to the current URL with query params and
  // nothing actually ran. Naming it anything else fixes the shadowing.
  async function submitTool(ev) {
    ev.preventDefault();
    const form = document.getElementById('tool-form');
    const fd = new FormData(form);
    // Resolve __OTHER__ → user-typed value for model before POST so
    // the backend sees a real value (mirrors interview.html). Strips
    // the side-channel `_other` field. Provider has no Other option.
    if (fd.get('provider_model') === '__OTHER__') {
      const typed = (fd.get('provider_model_other') || '').toString().trim();
      if (!typed) {
        const result = document.getElementById('result');
        result.classList.remove('hidden');
        result.className = 'w-full max-w-4xl fi-banner fi-banner-error';
        result.textContent = 'Pick a model or type one in the "Other" field.';
        document.getElementById('f-provider_model-other')?.focus();
        return false;
      }
      fd.set('provider_model', typed);
    }
    fd.delete('provider_model_other');
    const result = document.getElementById('result');
    result.classList.remove('hidden');
    result.className = 'w-full max-w-4xl fi-banner fi-banner-info';
    result.textContent = `Running ${spec.label}…`;
    let res;
    try {
      res = await fetch(`/api/tools/${spec.name}`, { method: 'POST', body: fd });
    } catch (e) {
      result.className = 'w-full max-w-4xl fi-banner fi-banner-error';
      result.textContent = `Network error: ${e}`;
      return false;
    }
    if (!res.ok) {
      result.className = 'w-full max-w-4xl fi-banner fi-banner-error';
      result.textContent = `Error ${res.status}: ${await res.text()}`;
      return false;
    }
    const body = await res.json();
    // Switch the banner into a live status panel and start polling.
    result.className = 'w-full max-w-4xl bg-surface-mid cyber-border rounded-xl p-6 mt-6';
    result.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-white/10">
        <div class="flex items-center gap-3">
          <span id="job-status-dot" class="w-2 h-2 rounded-full bg-status-success glow-pulse"></span>
          <span id="job-status-label" class="font-label-sm text-label-sm text-status-success uppercase tracking-wider">Running</span>
          <span class="font-code-md text-code-md text-on-surface-variant break-all">${escapeHtml(body.job_id)}</span>
        </div>
        <div class="flex items-center gap-2 font-label-sm text-label-sm text-outline uppercase">
          <span>pid ${body.pid}</span><span>·</span>
          <span id="job-age">0s</span>
        </div>
      </div>
      ${body.artifact_dir ? `<p class="mb-3 text-on-surface-variant text-body-md">Output → <code class="font-code-md text-secondary">${escapeHtml(body.artifact_dir)}</code></p>` : ''}
      <details class="mb-3"><summary class="cursor-pointer font-label-sm text-label-sm uppercase text-outline hover:text-primary">argv</summary><pre class="mt-2 max-h-32 overflow-auto font-code-md text-code-md text-on-surface-variant">${escapeHtml(JSON.stringify(body.argv_tail, null, 2))}</pre></details>
      <div class="font-label-sm text-label-sm uppercase text-outline mb-2">Live log</div>
      <pre id="job-log" class="bg-[#090909] border border-white/10 rounded p-3 font-code-md text-code-md h-72 overflow-y-auto whitespace-pre-wrap text-on-surface-variant shadow-[inset_0_0_40px_rgba(0,0,0,0.8)]"></pre>
      <div class="flex items-center gap-3 mt-4 flex-wrap">
        <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded font-label-sm text-label-sm uppercase bg-surface-mid cyber-border text-on-surface hover:bg-surface-high transition-colors">← Dashboard</a>
        <a href="/jobs/${encodeURIComponent(body.job_id)}" class="inline-flex items-center gap-2 px-4 py-2 rounded font-label-sm text-label-sm uppercase bg-gradient-to-r from-primary-container to-secondary-container text-white hover:opacity-90 transition-opacity">
          <span class="material-symbols-outlined text-[16px]">open_in_new</span> Open in /jobs
        </a>
        <a href="/jobs" class="inline-flex items-center gap-2 px-4 py-2 rounded font-label-sm text-label-sm uppercase text-on-surface-variant hover:text-primary transition-colors">All jobs →</a>
      </div>
    `;
    pollJob(body.job_id);
    return false;
  }

  // Live job-status poller. After a tool submit we hit /api/jobs/<id>
  // every 2s to refresh the in-page log tail and status pill, so the
  // user can actually see whether the proposal/critique/etc. is making
  // progress instead of staring at a static "Job started" message.
  function pollJob(jobId) {
    const logEl = document.getElementById('job-log');
    const dot = document.getElementById('job-status-dot');
    const label = document.getElementById('job-status-label');
    const ageEl = document.getElementById('job-age');
    let stopped = false;
    async function tick() {
      if (stopped) return;
      try {
        const res = await fetch(`/api/jobs/${encodeURIComponent(jobId)}`);
        if (!res.ok) return setTimeout(tick, 2000);
        const j = await res.json();
        if (j.log_tail && j.log_tail.length) {
          const wasNearBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
          logEl.textContent = j.log_tail.join('\n');
          if (wasNearBottom) logEl.scrollTop = logEl.scrollHeight;
        } else if (!logEl.textContent) {
          logEl.textContent = '(no output yet — process is starting)';
        }
        if (typeof j.age_seconds === 'number') ageEl.textContent = formatAge(j.age_seconds);
        if (j.alive) {
          dot.className = 'w-2 h-2 rounded-full bg-status-success glow-pulse';
          label.textContent = 'Running';
          label.className = 'font-label-sm text-label-sm text-status-success uppercase tracking-wider';
        } else {
          const ok = j.exit_code === 0 || j.exit_code === undefined;
          dot.className = `w-2 h-2 rounded-full ${ok ? 'bg-secondary' : 'bg-error'}`;
          label.textContent = ok ? `Done${j.exit_code === 0 ? ' (exit 0)' : ''}` : `Failed (exit ${j.exit_code})`;
          label.className = `font-label-sm text-label-sm ${ok ? 'text-secondary' : 'text-error'} uppercase tracking-wider`;
          stopped = true;
          return;
        }
      } catch (_) {}
      setTimeout(tick, 2000);
    }
    tick();
  }

  function formatAge(s) {
    if (s < 60) return `${Math.round(s)}s`;
    if (s < 3600) return `${Math.round(s / 60)}m ${Math.round(s % 60)}s`;
    return `${Math.round(s / 3600)}h ${Math.round((s % 3600) / 60)}m`;
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s); }

  load();
</script>
</body>
</html>
