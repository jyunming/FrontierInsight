<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Frontier Insight — Trash</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="/static/theme.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="/static/style.css"/>
<script defer src="/static/header.js"></script>
</head>
<body class="font-body text-on-surface min-h-screen antialiased">
<div id="fi-header-root" data-breadcrumb="Trash"></div>
<main class="max-w-[1440px] mx-auto px-6 md:px-10 pt-28 pb-24">

<section class="fi-page-hero">
  <h1>Trash</h1>
  <p class="fi-subtitle">Quests you deleted live here. Restore to put one back in the main outputs directory, or purge to delete it forever.</p>
</section>

<div id="trash-list" class="flex flex-col gap-3"></div>

<div id="empty" class="fi-empty-rich hidden">
  <svg class="fi-empty-art" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="14,18 50,18"></polyline>
    <path d="M18 18v32a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4V18"></path>
    <path d="M26 14a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4"></path>
    <line x1="28" y1="28" x2="28" y2="46"></line>
    <line x1="36" y1="28" x2="36" y2="46"></line>
  </svg>
  <h3>Trash is empty</h3>
  <p>Quests you delete from the dashboard land here. Nothing to clean up.</p>
</div>

</main>

<script>
  async function load() {
    const res = await fetch('/api/trash');
    const data = await res.json();
    const list = document.getElementById('trash-list');
    const empty = document.getElementById('empty');
    if (!data.items || data.items.length === 0) {
      empty.classList.remove('hidden');
      list.innerHTML = '';
      return;
    }
    empty.classList.add('hidden');
    list.innerHTML = data.items.map(renderItem).join('');
  }

  function renderItem(it) {
    const when = new Date(it.trashed_at * 1000).toLocaleString();
    const mb = (it.size_bytes / 1024 / 1024).toFixed(1);
    return `
      <div class="hairline-gradient p-5 rounded-xl flex items-center justify-between gap-4">
        <div class="flex flex-col gap-1 min-w-0 flex-1">
          <h3 class="font-mono text-headline-md text-on-surface truncate">${escapeHtml(it.bin_id)}</h3>
          <div class="flex items-center gap-4 font-mono text-[11px] text-on-surface-variant uppercase tracking-wider">
            <span><span class="opacity-50">SIZE:</span> ${mb} MB</span>
            <span><span class="opacity-50">TRASHED:</span> ${escapeHtml(when)}</span>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button class="px-4 py-2 rounded-lg bg-surface-container-high text-on-surface hover:bg-surface-container-highest transition-colors font-semibold text-body-sm" onclick="restore('${escapeHtml(it.bin_id)}')">Restore</button>
          <button class="px-4 py-2 rounded-lg border border-error/30 text-error hover:bg-error/10 transition-colors font-semibold text-body-sm" onclick="purge('${escapeHtml(it.bin_id)}')">Purge</button>
        </div>
      </div>`;
  }

  async function restore(binId) {
    const res = await fetch(`/api/trash/${encodeURIComponent(binId)}/restore`, {method: 'POST'});
    if (!res.ok) { alert('Restore failed: ' + await res.text()); return; }
    load();
  }

  async function purge(binId) {
    if (!confirm(`Permanently delete ${binId}? This cannot be undone.`)) return;
    const res = await fetch(`/api/trash/${encodeURIComponent(binId)}`, {method: 'DELETE'});
    if (!res.ok) { alert('Purge failed: ' + await res.text()); return; }
    load();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  load();
</script>
</body>
</html>
