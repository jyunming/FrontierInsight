# General-science test topic (neuroscience). A field-neutral simulation with a known answer, so a run can be checked
# against theory. Run: python launch.py --config dev/quest-topics/neuron_firing_rate.yaml
topic: |
  TOPIC. How does the firing rate of a simple model neuron depend on its input current, and how well does a closed-form expression predict it?

  CONTEXT. A leaky integrate-and-fire neuron obeys tau * dV/dt = -(V - V_rest) + R * I and fires when V reaches a threshold, then resets. For a constant input above threshold, the firing rate has a closed form.
  SCOPE. Simulate the neuron for constant currents from below to well above threshold with several time steps, measure the firing rate, and compare with the closed form. Report the error against step size, and repeat with added noise to show how noise smooths the sharp onset of firing.

  GOALS.
    - One Python script using numpy (and scipy where it helps), with matplotlib (Agg backend).
    - Two or three figures that answer the question directly, each with the reference or theory value drawn.
    - A short paper of at most 4 pages that cites at least three primary references.
  CONSTRAINTS.
    - CPU only; under 60 seconds of runtime; fixed random seeds, stated in the paper.
    - Report every number with its uncertainty, and say when a result is only a check of the code.

title: integrate-and-fire-rate

result_use: research

# The only thing to set before you run this: which model answers (see docs/PROVIDERS.md).
provider:
  name: openai

engine:
  framework: langgraph
  max_iterations: 2
  review_loop: true

execution:
  sandbox: venv
  timeout_s: 900
  python_version: "3.11"

knowledge:
  enabled: true
  top_k: 5

pauses:
  papers: false
  review: "off"

output:
  kinds:
    - paper_md
    - paper_pdf
  paper_format: generic
  output_dir: ./outputs
