# General-science test topic (machine learning). A field-neutral simulation with a known answer, so a run can be checked
# against theory. Run: python launch.py --config dev/quest-topics/cv_bias_small_n.yaml
topic: |
  TOPIC. How biased and how noisy is the accuracy reported by k-fold cross-validation when the data set is small?

  CONTEXT. With few examples, the accuracy a model gets in cross-validation is only an estimate of how it will do on new data, and it depends on how many folds are used.
  SCOPE. Generate a two-class problem from two overlapping Gaussian clouds whose true best accuracy is known. For training-set sizes n in {20, 40, 80, 160} compare 5-fold, 10-fold and leave-one-out cross-validation with a simple classifier (logistic regression). Estimate each method's bias against the accuracy on a very large fresh test set, and its spread over repeated data sets.

  GOALS.
    - One Python script using numpy (and scipy where it helps), with matplotlib (Agg backend).
    - Two or three figures that answer the question directly, each with the reference or theory value drawn.
    - A short paper of at most 4 pages that cites at least three primary references.
  CONSTRAINTS.
    - CPU only; under 60 seconds of runtime; fixed random seeds, stated in the paper.
    - Report every number with its uncertainty, and say when a result is only a check of the code.

title: cross-validation-bias-small-n

result_use: research

# The only thing to set before you run this: which model answers (see docs/PROVIDERS.md).
provider:
  name: openai

engine:
  framework: langgraph
  max_iterations: 2
  review_loop: true

execution:
  sandbox: venv
  timeout_s: 900
  python_version: "3.11"

knowledge:
  enabled: true
  top_k: 5

pauses:
  papers: false
  review: "off"

output:
  kinds:
    - paper_md
    - paper_pdf
  paper_format: generic
  output_dir: ./outputs
