# General-science test topic (statistics). A field-neutral simulation with a known answer, so a run can be checked
# against theory. Run: python launch.py --config dev/quest-topics/false_discovery.yaml
topic: |
  TOPIC. When many hypotheses are tested at once, how do Bonferroni correction and the Benjamini-Hochberg procedure compare in false discoveries and in power?

  CONTEXT. Testing thousands of hypotheses at a 5 percent level produces many false positives. Bonferroni controls the chance of any false positive; Benjamini-Hochberg controls the expected share of false positives among the positives found (the false discovery rate).
  SCOPE. Simulate m tests (m in {20, 200, 2000}) in which a fraction pi1 in {0.0, 0.05, 0.2} of the effects are real, with effect sizes drawn so the real ones are moderately detectable. Compare uncorrected, Bonferroni and Benjamini-Hochberg at a nominal 5 percent: report the realised false discovery rate and the power, with uncertainty over repeats.

  GOALS.
    - One Python script using numpy (and scipy where it helps), with matplotlib (Agg backend).
    - Two or three figures that answer the question directly, each with the reference or theory value drawn.
    - A short paper of at most 4 pages that cites at least three primary references.
  CONSTRAINTS.
    - CPU only; under 60 seconds of runtime; fixed random seeds, stated in the paper.
    - Report every number with its uncertainty, and say when a result is only a check of the code.

title: fdr-bonferroni-vs-bh

result_use: research

# The only thing to set before you run this: which model answers (see docs/PROVIDERS.md).
provider:
  name: openai

engine:
  framework: langgraph
  max_iterations: 2
  review_loop: true

execution:
  sandbox: venv
  timeout_s: 900
  python_version: "3.11"

knowledge:
  enabled: true
  top_k: 5

pauses:
  papers: false
  review: "off"

output:
  kinds:
    - paper_md
    - paper_pdf
  paper_format: generic
  output_dir: ./outputs
