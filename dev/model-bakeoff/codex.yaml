# Model comparison run: OpenAI Codex CLI (gpt-5.6-sol, reasoning effort high)
#
# Four runs, one per interface, on one topic and the cheapest viable workflow
# (single reviewer, one cross-check per finding, two iterations, paper only).
# Everything except `provider` is identical across the four, so a difference
# in the output is attributable to the model rather than the configuration.
topic: |
  TOPIC. Low-k1 DUV (193 nm immersion) lithography in production reality:
    what it still does better than EUV, where it breaks down, and how to decide
    between them for a given layer.
  
  CONTEXT. k1 = CD * NA / lambda. With 193i (lambda = 193 nm, NA = 1.35), the
    Rayleigh limit k1 = 0.25 puts single-exposure half-pitch at ~36 nm. Reaching
    tighter pitches means multi-patterning (LELE, SADP, SAQP), which multiplies
    mask count, process steps, and overlay budget. EUV reaches the same pitch in
    one exposure but carries its own costs: tool price, throughput, resist
    stochastics, mask defectivity.
  
  SCOPE (THEORY-FORWARD, NO FAB EQUIPMENT NEEDED).
    1. Build an aerial-image model for 193i at a swept k1 from ~0.45 down to
       ~0.28, computing contrast and NILS for a dense line-space pattern under
       conventional and dipole illumination.
    2. Quantify the process window (depth of focus and exposure latitude) as a
       function of k1, and identify where it collapses below a usable threshold.
    3. Model the multi-patterning cost of reaching a target pitch with 193i:
       number of exposures, cumulative overlay error budget, and the resulting
       edge-placement error, versus a single EUV exposure.
    4. State the crossover explicitly: at which pitch, and under which
       assumptions about overlay and stochastics, does 193i multi-patterning
       stop being preferable to EUV? Report the assumptions the answer is most
       sensitive to.
  
  DELIVERABLES.
    - One self-contained Python script (numpy + matplotlib, Agg backend,
      headless, CPU-only, < 60 s).
    - Three figures: (a) contrast and NILS versus k1 for both illuminations;
      (b) process window versus k1 with the usability threshold marked;
      (c) edge-placement error versus pitch for 193i multi-patterning against a
      single EUV exposure.
    - A concise IMRAD paper grounding every quantitative claim in either the
      simulation or a cited primary source.
    - Sign the paper. Immediately under the title, on its own line, write
      "Generated by the OpenAI Codex CLI (gpt-5.6-sol)" and nothing else. Use exactly that
      interface name and the identifier of the model you are actually running
      as; do not substitute a family name, a vendor, or a guess. This is how
      the four runs of this study are told apart, so it is not optional.
  
  CONSTRAINTS.
    - Scalar or simple vector aerial-image model; no rigorous EMF mask solver.
    - Treat resist chemistry as a threshold; stochastics enter only as a stated
      assumption in the EUV comparison, not as a simulated mechanism.
title: lowk1_codex

provider:
  name: "codex_cli"
  model: "gpt-5.6-sol"
  node_model_fallbacks: {}

engine:
  # Three-persona panel. The methodologist owns the non-bypassable
  # must-flag rules (circular evaluation, single-point eval, weak
  # baseline, pseudo-units); an empty list disables that enforcement.
  review_panel: [methodologist]
  framework: langgraph
  clarify_mode: "off"           # unattended run — no interactive clarify
  human_feedback_gate: "off"    # no mid-run pause
  review_loop: true             # methodologist / statistician / devil's-advocate panel
  degenerate_run_guard: true    # catch trivial / empty experiments
  enable_analyze_reroute: true  # let cross_check's re_experiment loop back to redesign
  cross_check_per_finding_k: 1
  max_iterations: 2

  # A/B arm — every trusted skill is a candidate
  skills: []
  skills_exclude: []

execution:
  sandbox: venv
  timeout_s: 600
  python_version: "3.11"

knowledge:
  enabled: true
  web_search: true
  web_search_backend: "auto"
  web_search_top_k: 10
  web_fetch_pages: true
  try_fetch_full_text: true
  relevance_guard: true
  external_top_k: 12
  literature_excerpt_chars: 4000
  passage_ranking: "auto"
  pause_for_user_papers: false  # never pause — fully unattended

output:
  kinds:
    - paper_md
    - paper_pdf
  paper_format: generic          # IMRAD
  output_dir: ./outputs
