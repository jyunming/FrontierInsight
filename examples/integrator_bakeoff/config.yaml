# How FI runs the study in commission.yaml (the question, what it covers, the time allowed and what counts as
# supported). Run it:  fi --config examples/integrator_bakeoff/config.yaml

commission: commission.yaml

title: bakeoff-integrators-fi-redesign

# What the result is for (explore, research or decision). Left out, a quest is an exploration and its paper
# is marked preliminary.
result_use: research

# The only thing to set before you run this: which model answers. `openai` reads the key from the environment variable
# OPENAI_API_KEY (or a .env file in the folder you run from) and uses gpt-5. Any other provider works: gemini,
# claude_cli, codex_cli, ollama or vscode_extension (see the table in the README and docs/PROVIDERS.md).
provider:
  name: openai

engine:
  framework: langgraph
  max_iterations: 2
  review_loop: true

execution:
  sandbox: venv
  timeout_s: 1800
  python_version: "3.11"

knowledge:
  enabled: true
  top_k: 5
  write_back_quests: true

# FI stops after the review by default, to let you accept or reject the paper (pauses.review). This example turns it
# off so the first run finishes on its own; set it back to "ask" to be asked.
pauses:
  review: "off"

output:
  page_limit: 4  # the page limit the commission's scope states
  kinds:
    - paper_md
    - paper_pdf
  paper_format: generic
  output_dir: ./outputs
