# How FI runs the study in commission.yaml.

commission: commission.yaml

title: bootstrap-ci-coverage-small-samples

# What the result is for (explore, research or decision). Left out, a quest is an exploration and its paper
# is marked preliminary.
result_use: research

provider:
  name: ollama
  model: gpt-oss:120b-cloud
  base_url: http://127.0.0.1:11434/v1

engine:
  framework: langgraph
  max_iterations: 1
  review_loop: false

execution:
  sandbox: venv
  timeout_s: 300
  python_version: "3.11"

knowledge:
  enabled: true

output:
  page_limit: 4  # the page limit the commission's scope states
  kinds:
    - paper_md
    - paper_pdf
    - slides
    - poster
    - speech
  paper_format: generic
  output_dir: ./outputs
