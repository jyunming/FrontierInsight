# Format validation - policy_brief x "brief preprint"
# All format_validation/*.yaml run the same study (commission.yaml), so
# differences in the produced paper come from paper_format
# only. ("brief" and "journallength" in the file names are history: how deep a study goes is no longer a setting,
# so the length follows the format; set `output.page_limit` to cap the pages.) Run via:
#   python launch.py --fleet examples/format_validation/*.yaml --max-concurrent 3
commission: commission.yaml

title: format-check-policy_brief

provider:
  name: gemini_cli
  model: gemini-3.1-flash-lite-preview

engine:
  framework: langgraph
  max_iterations: 1
  review_loop: false

execution:
  sandbox: venv
  timeout_s: 600
  python_version: "3.11"

knowledge:
  enabled: true

output:
  kinds: ["paper_md", "paper_pdf"]
  paper_format: policy_brief
  output_dir: ./outputs
