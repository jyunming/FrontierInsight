# Format validation - whitepaper x journal-length
# All format_validation/*.yaml run the same study (commission.yaml), so
# differences in the produced paper come from paper_format / study_depth
# only. Run via:
#   python launch.py --fleet examples/format_validation/*.yaml --max-concurrent 3
commission: commission.yaml

title: format-check-whitepaper

provider:
  name: gemini_cli
  model: gemini-3.1-flash-lite-preview

engine:
  framework: langgraph
  max_iterations: 1
  review_loop: false
  clarify_mode: "off"
  clarify_overrides:
    study_depth: journal-length
    paper_venue: whitepaper
    output_kinds: ["paper_md", "paper_pdf"]
    simulatability: "yes"
    comparative_baseline: ""
    success_metric: "ROC-AUC > 0.9"
    budget: ""

execution:
  sandbox: venv
  timeout_s: 600
  python_version: "3.11"

knowledge:
  enabled: true

output:
  kinds: ["paper_md", "paper_pdf"]
  paper_format: whitepaper
  output_dir: ./outputs
